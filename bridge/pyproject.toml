[project]
name = "hermes-remote-bridge"
version = "0.0.0"  # packaging only; the bridge reports its release tag (hermes_remote_bridge.__version__)
description = "Self-hosted bridge between the Hermes Mobile Remote Android app and the local Hermes Agent API server"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    # The live link to Hermes' JSON-RPC socket (relay.py).
    "websockets>=13",
    "segno>=1.6",
    "cryptography>=43",
    # The PC monitor (stats, processes) everywhere; interface addresses off Linux.
    "psutil>=6",
    "zeroconf>=0.132; sys_platform != 'linux'",
    "pyte>=0.8.2",
    "comtypes>=1.4.17 ; sys_platform == 'win32'",
]

[project.scripts]
hermes-remote-bridge = "hermes_remote_bridge.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hermes_remote_bridge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
