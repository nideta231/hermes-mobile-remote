name: Release

# Push a tag like v0.8.0 to publish a signed APK. Installed apps find it through
# Settings → System → "Check for updates", or on their own at startup.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        working-directory: android
        run: ./gradlew --no-daemon testReleaseUnitTest

      - name: Build signed APK
        working-directory: android
        env:
          APP_VERSION: ${{ github.ref_name }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: release
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Release signing secrets are not set (see README, Releasing)"; exit 1
          fi
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_FILE"
          ./gradlew --no-daemon assembleRelease
          rm -f "$ANDROID_KEYSTORE_FILE"
          version="${GITHUB_REF_NAME#v}"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/HermesRemote-$version.apk"
          (cd "$RUNNER_TEMP" && sha256sum "HermesRemote-$version.apk" > "HermesRemote-$version.apk.sha256")

      # Installed apps only accept updates signed with this key; refuse to publish anything else.
      - name: Check signature
        env:
          RELEASE_CERT_SHA256: d7aee96b41eb642c7e2c9282c95c8a02908712e23d0e66c7408646c89f0d0de9
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          certs=$("$apksigner" verify --print-certs "$RUNNER_TEMP"/HermesRemote-*.apk 2>&1) || { echo "$certs"; exit 1; }
          echo "$certs"
          echo "$certs" | grep -qE "Signer.* certificate SHA-256 digest: $RELEASE_CERT_SHA256" \
            || { echo "::error::APK is not signed with the release key"; exit 1; }

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        # The notes are the full CHANGELOG.md from this tag's section down, so someone skipping
        # versions sees everything since theirs. The app shows them on its update card.
        run: |
          awk -v tag="## $GITHUB_REF_NAME" '$0 == tag {on = 1} on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          [ -s "$RUNNER_TEMP/notes.md" ] || { echo "::error::CHANGELOG.md has no '## $GITHUB_REF_NAME' section"; exit 1; }
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/HermesRemote-*.apk "$RUNNER_TEMP"/HermesRemote-*.apk.sha256 \
            --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
